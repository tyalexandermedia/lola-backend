<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Did You Show Up? Get Found on Google & AI — Lola Leads, Tampa Bay</title>

    />

    <!-- Sharp display face for headlines. display=swap → text is visible in the

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

    <!-- Open Graph (Facebook, LinkedIn, iMessage previews) -->

    <meta property="og:site_name" content="Lola Leads" />
    <meta property="og:title" content="Your next customer already searched for you. Did you show up?" />
    <meta property="og:description" content="Local service businesses lose customers every day to Google and AI results they don't know exist. Lola makes sure you're the one they find — and choose. Free 60-second Growth Score, then one all-inclusive plan at $397/month with your website design included — backed by the 90-Day Promise." />
    <meta property="og:url" content="https://lola.tyalexandermedia.com" />
    <meta property="og:image" content="https://lola.tyalexandermedia.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- Alt text for the share card. Screen readers announce it when the
         preview is posted in Slack/iMessage/LinkedIn, and X uses it too. -->
    <meta property="og:image:alt" content="Lola Leads — Your next customer already searched for you. Did you show up? Website designed and built included free, then $397/month." />
    <meta name="twitter:image:alt" content="Lola Leads — Your next customer already searched for you. Did you show up? Website designed and built included free, then $397/month." />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Your next customer already searched for you. Did you show up?" />
    <meta name="twitter:description" content="Lola gets local service businesses found on Google AND in ChatGPT, Perplexity, Gemini — and chosen. Free 60-second Growth Score, then $397/month all-inclusive — website design included. Built by Coach Ty in Tampa Bay." />
    <meta name="twitter:image" content="https://lola.tyalexandermedia.com/og.png" />

    <!-- Theme color (matches dark hero) -->
    <meta name="theme-color" content="#0A0A0B" />

    <!-- Icons. The SVG is the primary (crisp at any size, ~200 bytes); the PNGs
         exist because iOS home-screen and Android install prompts don't accept
         SVG. All four are rendered from the same mark as favicon.svg, so the
         set can't drift into two different logos. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- ───────── JSON-LD: ProfessionalService (provider) ───────── -->
    <!-- Crawlable in the static shell so Google + AI agents resolve the entity
         even though the marketing UI is client-rendered React. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "@id": "https://lola.tyalexandermedia.com/#business",
      "name": "Lola Leads (Ty Alexander Media)",
      "alternateName": ["Lola Leads", "Lola", "Lola — AI Leads Expert", "Lola AI Leads Expert", "Lola SEO", "Lola AI"],
      "image": "https://lola.tyalexandermedia.com/coach-ty.jpg",
      "url": "https://lola.tyalexandermedia.com",
      "telephone": "+1-727-300-6573",
      "email": "ty@tyalexandermedia.com",
      "priceRange": "$397/month",
      "description": "AI-powered local lead generation + SEO for service businesses. Done-for-you Google + AI search visibility (ChatGPT, Perplexity, Gemini, Google AI Overviews). One all-inclusive plan at $397/month with your website design included, backed by the 90-Day Promise.",
      "founder": {
        "@type": "Person",
        "name": "Ty Alexander Traufield",
        "alternateName": ["Coach Ty", "Ty Alexander"],
        "jobTitle": "Founder, Lola Leads",
        "worksFor": { "@type": "Organization", "name": "Ty Alexander Media" },
        "url": "https://tyalexandermedia.com"
      },
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Tampa Bay",
        "addressRegion": "FL",
        "addressCountry": "US"
      },
      "geo": { "@type": "GeoCoordinates", "latitude": "27.9506", "longitude": "-82.4572" },
      "areaServed": [
        { "@type": "State", "name": "Florida" },
        { "@type": "City", "name": "Tampa" },
        { "@type": "City", "name": "St. Petersburg" },
        { "@type": "City", "name": "Clearwater" },
        { "@type": "City", "name": "Palm Harbor" },
        { "@type": "City", "name": "Sarasota" }
      ],
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],
        "opens": "08:00",
        "closes": "18:00"
      },
      "offers": {
        "@type": "Offer",
        "name": "The monthly",
        "price": "397",
        "priceCurrency": "USD",
        "availability": "https://schema.org/InStock",
        "url": "https://lola.tyalexandermedia.com/pricing",
        "priceSpecification": {
          "@type": "UnitPriceSpecification",
          "price": "397",
          "priceCurrency": "USD",
          "unitCode": "MON",
          "billingIncrement": 1
        }
      },
      "parentOrganization": {
        "@type": "Organization",
        "name": "Ty Alexander Media",
        "url": "https://tyalexandermedia.com"
      },
      "sameAs": [
        "https://tyalexandermedia.com",
        "https://www.google.com/maps/search/?api=1&query=Ty+Alexander+Media+Tampa+FL",
        "https://www.instagram.com/tyalexandermedia"
      ]
    }
    </script>

    <!-- ───────── JSON-LD: Service + the single monthly offer ─────────
         Names the plan and its recurring price so an answer engine asked
         "how much is Lola" quotes $397/month rather than inferring from a
         range. Mirrors frontend/src/lib/pricing.ts — update both together. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Service",
      "@id": "https://lola.tyalexandermedia.com/#service",
      "name": "Local SEO and AI search visibility for local service businesses",
      "serviceType": "Local SEO and AI search visibility",
      "provider": { "@id": "https://lola.tyalexandermedia.com/#business" },
      "areaServed": [
        { "@type": "City", "name": "Tampa" },
        { "@type": "City", "name": "St. Petersburg" },
        { "@type": "City", "name": "Clearwater" },
        { "@type": "City", "name": "Palm Harbor" }
      ],
      "audience": {
        "@type": "BusinessAudience",
        "name": "Local service businesses — pressure washing, plumbing, HVAC, roofing, pool care and other local trades"
      },
      "offers": {
        "@type": "Offer",
        "name": "The monthly",
        "price": "397",
        "priceCurrency": "USD",
        "description": "All-inclusive monthly plan: your website designed and built (included, no setup fee), Google Business Profile managed, and ongoing visibility work across Google and the AI answer engines (ChatGPT, Perplexity, Gemini). Backed by the 90-Day Promise — ranking on page one or in the map pack within 90 days, or your next 2 months are free.",
        "availability": "https://schema.org/InStock",
        "priceSpecification": {
          "@type": "UnitPriceSpecification",
          "price": "397",
          "priceCurrency": "USD",
          "billingIncrement": 1,
          "unitCode": "MON"
        }
      }
    }
    </script>

    <!-- ───────── JSON-LD: FAQPage ───────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What kinds of businesses does Lola work with?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Local service businesses of all kinds — home services like pressure washing, plumbing, HVAC, roofing, and pool care, plus other local trades and service providers who get most of their customers from their local area. If your next customer is searching Google or asking ChatGPT for a business near them, Lola helps them find you."
          }
        },
        {
          "@type": "Question",
          "name": "How much does Lola cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "One plan: $397/month, all-inclusive. Your website design is included — no setup fee and no build charge — then I manage your Google Business Profile and keep you visible on Google and in the AI answers. Cancel anytime after the first 3 months. Backed by the 90-Day Promise. Start with the free Growth Score to see where you stand."
          }
        },
        {
          "@type": "Question",
          "name": "Does Lola help me show up in ChatGPT and AI search, not just Google?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Lola optimizes for both traditional Google local results and AI search — ChatGPT, Perplexity, Gemini, and Google AI Overviews — because that's increasingly where buyers ask for a recommendation."
          }
        },
        {
          "@type": "Question",
          "name": "Is there a guarantee?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes — the 90-Day Promise. We pick your money keywords together in week 1. If I don't get you ranking on page one or in the map pack within 90 days, your next 2 months are free. No fine print."
          }
        },
        {
          "@type": "Question",
          "name": "Can you actually guarantee leads?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No — and I won't pretend to. I guarantee visibility: that you're found and clickable on Google and in the AI answers. Whether a click becomes a job also depends on your pricing and follow-through. The 90-Day Promise covers the ranking I control: we pick your money keywords together in week 1, and if you're not on page one or in the map pack within 90 days, your next 2 months are free."
          }
        },
        {
          "@type": "Question",
          "name": "Why is it $397/month when agencies quote $5,000 a month?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Because you're not paying for an office, an account manager, or a sales team — Ty does the work himself. A $5,000/month retainer is $60,000 in year one and usually a 12-month contract. This is $397/month with your website design included, no setup fee, cancel anytime after the first 3 months — and if I don't get you ranking in 90 days, your next 2 months are free. Same job, without the overhead you were funding."
          }
        },
        {
          "@type": "Question",
          "name": "Who is behind Lola?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ty Alexander Traufield — “Coach Ty” — based in St. Petersburg and serving all of Tampa Bay. He's a group strength & conditioning coach and a full-time GM who trains for HYROX, and he built Lola to fix the local visibility of his father's real business, Sandbar Soft Wash. He now runs that same system for other local service businesses, does the work himself, and answers his own phone."
          }
        },
        {
          "@type": "Question",
          "name": "Why is it called Lola?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Lola is Ty's dog — born in 2018, and the reason the whole thing exists. The goal behind the business is simple: help enough local businesses win to buy her the backyard she deserves. When you win, so does she."
          }
        }
      ]
    }
    </script>
  </head>
  <!-- Ground and ink come from index.css, not utilities here. These two classes
       are class selectors and so outrank the `body { background; color }` rule,
       which is why lifting the page off pure black silently did nothing. -->
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
