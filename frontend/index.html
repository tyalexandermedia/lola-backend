  <head>

    <!-- Sharp display face for headlines. display=swap → text is visible in the

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

    <!-- Open Graph (Facebook, LinkedIn, iMessage previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lola Leads" />
    <meta property="og:title" content="Your next customer already searched for you. Did you show up?" />
    <meta property="og:description" content="Local service businesses lose customers every day to Google and AI results they don't know exist. Lola makes sure you're the one they find — and choose. Free 60-second Growth Score, then DIY $197 or the $997 Full Build, backed by the Half-Back Guarantee." />
    <meta property="og:url" content="https://lola.tyalexandermedia.com" />
    <meta property="og:image" content="https://lola.tyalexandermedia.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Your next customer already searched for you. Did you show up?" />
    <meta name="twitter:description" content="Lola gets local service businesses found on Google AND in ChatGPT, Perplexity, Gemini — and chosen. Free 60-second Growth Score, then DIY $197 or the $997 Full Build. Built by Coach Ty in Tampa Bay." />
    <meta name="twitter:image" content="https://lola.tyalexandermedia.com/og.png" />

    <!-- Theme color (matches dark hero) -->
    <meta name="theme-color" content="#0A0A0B" />

    <link rel="icon" href="/favicon.svg" />

    <!-- ───────── JSON-LD: ProfessionalService (provider) ───────── -->
    <!-- Crawlable in the static shell so Google + AI agents resolve the entity
         even though the marketing UI is client-rendered React. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "@id": "https://lola.tyalexandermedia.com/#business",
      "name": "Lola Leads (Ty Alexander Media)",
      "alternateName": ["Lola Leads", "Lola", "Lola — AI Leads Expert", "Lola AI Leads Expert", "Lola SEO", "Lola AI"],
      "image": "https://lola.tyalexandermedia.com/coach-ty.jpg",
      "url": "https://lola.tyalexandermedia.com",
      "telephone": "+1-727-300-6573",
      "email": "ty@tyalexandermedia.com",
      "priceRange": "$197-$997",
      "description": "AI-powered local lead generation + SEO for service businesses. Done-for-you Google + AI search visibility (ChatGPT, Perplexity, Gemini, Google AI Overviews). Two one-time options: DIY $197 or the $997 Full Build, backed by the Half-Back Guarantee.",
      "founder": {
        "@type": "Person",
        "name": "Ty Alexander Traufield",
        "alternateName": ["Coach Ty", "Ty Alexander"],
        "jobTitle": "Founder, Lola Leads",
        "worksFor": { "@type": "Organization", "name": "Ty Alexander Media" },
        "url": "https://tyalexandermedia.com"
      },
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Tampa Bay",
        "addressRegion": "FL",
        "addressCountry": "US"
      },
      "geo": { "@type": "GeoCoordinates", "latitude": "27.9506", "longitude": "-82.4572" },
      "areaServed": [
        { "@type": "State", "name": "Florida" },
        { "@type": "City", "name": "Tampa" },
        { "@type": "City", "name": "St. Petersburg" },
        { "@type": "City", "name": "Clearwater" },
        { "@type": "City", "name": "Palm Harbor" },
        { "@type": "City", "name": "Sarasota" }
      ],
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],
        "opens": "08:00",
        "closes": "18:00"
      },
      "offers": {
        "@type": "AggregateOffer",
        "lowPrice": "197",
        "highPrice": "997",
        "priceCurrency": "USD",
        "offerCount": "2"
      },
      "parentOrganization": {
        "@type": "Organization",
        "name": "Ty Alexander Media",
        "url": "https://tyalexandermedia.com"
      },
      "sameAs": [
        "https://tyalexandermedia.com",
        "https://www.google.com/maps/search/?api=1&query=Ty+Alexander+Media+Tampa+FL",
        "https://www.instagram.com/tyalexandermedia"
      ]
    }
    </script>

    <!-- ───────── JSON-LD: Service + the two real offers ─────────
         The ProfessionalService block carries an AggregateOffer range; this
         names the two tiers explicitly so an answer engine asked "how much
         is Lola / what do I get for $997" can quote the actual package
         instead of inferring from a price range. Prices mirror
         frontend/src/lib/pricing.ts — update both together. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Service",
      "@id": "https://lola.tyalexandermedia.com/#service",
      "name": "Local SEO and AI search visibility for local service businesses",
      "serviceType": "Local SEO and AI search visibility",
      "provider": { "@id": "https://lola.tyalexandermedia.com/#business" },
      "areaServed": [
        { "@type": "City", "name": "Tampa" },
        { "@type": "City", "name": "St. Petersburg" },
        { "@type": "City", "name": "Clearwater" },
        { "@type": "City", "name": "Palm Harbor" }
      ],
      "audience": {
        "@type": "BusinessAudience",
        "name": "Local service businesses — pressure washing, plumbing, HVAC, roofing, pool care and other local trades"
      },
      "offers": [
        {
          "@type": "Offer",
          "name": "DIY",
          "price": "197",
          "priceCurrency": "USD",
          "description": "All four fixes written for your business — title tag, Google Business Profile description, first GBP post, and LocalBusiness schema — plus the order to ship them in. One-time, you do the work. The Growth Score itself and the first finished fix are free.",
          "availability": "https://schema.org/InStock"
        },
        {
          "@type": "Offer",
          "name": "Full Build",
          "price": "997",
          "priceCurrency": "USD",
          "description": "Custom website build, Google Business Profile optimization, and 30 days of visibility work across Google and AI answer engines (ChatGPT, Perplexity, Gemini). One-time, no contract, backed by the Half-Back Guarantee.",
          "availability": "https://schema.org/InStock"
        }
      ]
    }
    </script>

    <!-- ───────── JSON-LD: FAQPage ───────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What kinds of businesses does Lola work with?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Local service businesses of all kinds — home services like pressure washing, plumbing, HVAC, roofing, and pool care, plus other local trades and service providers who get most of their customers from their local area. If your next customer is searching Google or asking ChatGPT for a business near them, Lola helps them find you."
          }
        },
        {
          "@type": "Question",
          "name": "How much does Lola cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Two simple options, both one-time. DIY is $197 — you get your full Growth Score plus a simple 5-step fix-it checklist and do the work yourself. The Full Build is $997 — we build your site and get you found on Google and in AI answers, backed by the Half-Back Guarantee. No setup fee, no contract. Start with the free Growth Score to see where you stand."
          }
        },
        {
          "@type": "Question",
          "name": "Does Lola help me show up in ChatGPT and AI search, not just Google?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Lola optimizes for both traditional Google local results and AI search — ChatGPT, Perplexity, Gemini, and Google AI Overviews — because that's increasingly where buyers ask for a recommendation."
          }
        },
        {
          "@type": "Question",
          "name": "Is there a guarantee?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes — the Half-Back Guarantee on the Full Build. We pick 5 money keywords for your business together in week 1. If we don't get at least 1 of them ranking on page 1 or in the map pack within 30 days, you get half your investment back. No fine print."
          }
        },
        {
          "@type": "Question",
          "name": "Can you actually guarantee leads?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No — and we won't pretend to. We guarantee visibility: that you're found and clickable on Google and in AI answers. Whether a click becomes a job also depends on your pricing and follow-through. The Half-Back Guarantee is on the ranking we control: pick 5 money keywords together in week 1, and if we don't get at least 1 to page 1 or the map pack within 30 days, you get half back."
          }
        },
        {
          "@type": "Question",
          "name": "Why is it $997 when agencies quote $5,000 a month?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Because you're not paying for an office, an account manager, or a sales team — Ty does the work himself. A $5,000/month retainer is $60,000 in year one and usually a 12-month contract. The Full Build is $997 one-time, no contract, and if we don't get you ranking you get half of that back. Same job, without the overhead you were funding."
          }
        },
        {
          "@type": "Question",
          "name": "Who is behind Lola?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ty Alexander Traufield — “Coach Ty” — based in St. Petersburg and serving all of Tampa Bay. He's a group strength & conditioning coach and a full-time GM who trains for HYROX, and he built Lola to fix the local visibility of his father's real business, Sandbar Soft Wash. He now runs that same system for other local service businesses, does the work himself, and answers his own phone."
          }
        },
        {
          "@type": "Question",
          "name": "Why is it called Lola?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Lola is Ty's dog — born in 2018, and the reason the whole thing exists. The goal behind the business is simple: help enough local businesses win to buy her the backyard she deserves. When you win, so does she."
          }
        }
      ]
    }
    </script>
  </head>
