<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Did You Show Up? Get Found on Google & AI — Coach Ty Leads, Tampa Bay</title>
    <meta
      name="description"
      content="Your next customer already searched for you on Google and ChatGPT. Coach Ty Leads makes sure you're the one they find — and choose. Start with a free 60-second Growth Score, then pick a plan from $397/month. Built by Coach Ty in Tampa Bay."
    />

    <!-- Sharp display face for headlines. display=swap → text is visible in the
         system fallback immediately and swaps in when the font loads. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

    <!-- Open Graph (Facebook, LinkedIn, iMessage previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Coach Ty Leads" />
    <meta property="og:title" content="Your next customer already searched for you. Did you show up?" />
    <meta property="og:description" content="Local service businesses lose customers every day to Google and AI results they don't know exist. Coach Ty Leads makes sure you're the one they find — and choose. Start with a free 60-second Growth Score, then pick a plan from $397/month." />
    <meta property="og:url" content="https://www.coachtyleads.com" />
    <meta property="og:image" content="https://www.coachtyleads.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- Alt text for the share card. Screen readers announce it when the
         preview is posted in Slack/iMessage/LinkedIn, and X uses it too.
         NOTE: prerender.mjs does NOT rewrite these two alt tags, so they ship
         on every route — keep them free of stale/route-specific claims. -->
    <meta property="og:image:alt" content="Coach Ty Leads — Your next customer already searched for you. Did you show up? Start with a free Growth Score, then plans from $397/month." />
    <meta name="twitter:image:alt" content="Coach Ty Leads — Your next customer already searched for you. Did you show up? Start with a free Growth Score, then plans from $397/month." />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Your next customer already searched for you. Did you show up?" />
    <meta name="twitter:description" content="Coach Ty Leads gets local service businesses found on Google AND in ChatGPT, Perplexity, Gemini — and chosen. Free 60-second Growth Score, then plans from $397/month. Built by Coach Ty in Tampa Bay." />
    <meta name="twitter:image" content="https://www.coachtyleads.com/og.png" />

    <!-- Theme color (matches light ground) -->
    <meta name="theme-color" content="#FAF9F5" />

    <!-- Icons. The SVG is the primary (crisp at any size, ~200 bytes); the PNGs
         exist because iOS home-screen and Android install prompts don't accept
         SVG. All four are rendered from the same mark as favicon.svg, so the
         set can't drift into two different logos. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- ───────── JSON-LD: ProfessionalService (provider) ─────────
         Crawlable in the static shell so Google + AI agents resolve the entity
         even though the marketing UI is client-rendered React.
         NOTE: for every prerendered route, scripts/prerender.mjs REPLACES the
         JSON-LD below with the per-route graph from src/lib/pageMeta.ts. These
         blocks are the template/dev fallback — keep them mirrored to pageMeta
         and docs/PRICING.md so a non-prerendered fallback is never stale. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "@id": "https://www.coachtyleads.com/#business",
      "name": "Coach Ty Leads (Ty Alexander Media)",
      "alternateName": ["Coach Ty Leads", "The Lola Local Growth System", "Lola"],
      "image": "https://www.coachtyleads.com/coach-ty.jpg",
      "url": "https://www.coachtyleads.com",
      "telephone": "+1-727-300-6573",
      "email": "ty@tyalexandermedia.com",
      "priceRange": "$397–$797/month",
      "description": "Done-for-you local SEO and lead systems for home-service contractors. Google + AI search visibility (ChatGPT, Perplexity, Gemini, Google AI Overviews), reviews and lead follow-up. Plans from $397/month, or a complete conversion-focused website + growth system at $797/month.",
      "founder": {
        "@type": "Person",
        "name": "Ty Alexander Traufield",
        "alternateName": ["Coach Ty", "Ty Alexander"],
        "jobTitle": "Founder, Coach Ty Leads",
        "worksFor": { "@type": "Organization", "name": "Ty Alexander Media" },
        "url": "https://tyalexandermedia.com"
      },
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Tampa Bay",
        "addressRegion": "FL",
        "addressCountry": "US"
      },
      "geo": { "@type": "GeoCoordinates", "latitude": "27.9506", "longitude": "-82.4572" },
      "areaServed": [
        { "@type": "State", "name": "Florida" },
        { "@type": "City", "name": "Tampa" },
        { "@type": "City", "name": "St. Petersburg" },
        { "@type": "City", "name": "Clearwater" },
        { "@type": "City", "name": "Palm Harbor" },
        { "@type": "City", "name": "Sarasota" }
      ],
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],
        "opens": "08:00",
        "closes": "18:00"
      },
      "offers": [
        {
          "@type": "Offer",
          "name": "Local Visibility",
          "price": "397",
          "priceCurrency": "USD",
          "availability": "https://schema.org/InStock",
          "url": "https://www.coachtyleads.com/pricing",
          "priceSpecification": {
            "@type": "UnitPriceSpecification",
            "price": "397",
            "priceCurrency": "USD",
            "unitCode": "MON",
            "billingIncrement": 1
          }
        },
        {
          "@type": "Offer",
          "name": "Local Growth System",
          "price": "797",
          "priceCurrency": "USD",
          "availability": "https://schema.org/InStock",
          "url": "https://www.coachtyleads.com/pricing",
          "priceSpecification": {
            "@type": "UnitPriceSpecification",
            "price": "797",
            "priceCurrency": "USD",
            "unitCode": "MON",
            "billingIncrement": 1
          }
        }
      ],
      "parentOrganization": {
        "@type": "Organization",
        "name": "Ty Alexander Media",
        "url": "https://tyalexandermedia.com"
      },
      "sameAs": [
        "https://tyalexandermedia.com",
        "https://www.google.com/maps/search/?api=1&query=Ty+Alexander+Media+Tampa+FL",
        "https://www.instagram.com/tyalexandermedia"
      ]
    }
    </script>

    <!-- ───────── JSON-LD: Service + the two plan offers ─────────
         Names the plans and their recurring prices so an answer engine asked
         "how much is Coach Ty Leads" quotes the real range rather than inferring
         it. Mirrors frontend/src/lib/pricing.ts — update both together. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Service",
      "@id": "https://www.coachtyleads.com/#service",
      "name": "Local SEO and AI search visibility for local service businesses",
      "serviceType": "Local SEO and AI search visibility",
      "provider": { "@id": "https://www.coachtyleads.com/#business" },
      "areaServed": [
        { "@type": "City", "name": "Tampa" },
        { "@type": "City", "name": "St. Petersburg" },
        { "@type": "City", "name": "Clearwater" },
        { "@type": "City", "name": "Palm Harbor" }
      ],
      "audience": {
        "@type": "BusinessAudience",
        "name": "Local service businesses — pressure washing, plumbing, HVAC, roofing, pool care and other local trades"
      },
      "offers": [
        {
          "@type": "Offer",
          "name": "Local Visibility",
          "price": "397",
          "priceCurrency": "USD",
          "description": "$397/month plus a one-time $397 activation. Google Business Profile management, review system, missed-call text-back, and call + form tracking for a business that already has a usable website. 90-day initial term, then month-to-month.",
          "availability": "https://schema.org/InStock",
          "priceSpecification": {
            "@type": "UnitPriceSpecification",
            "price": "397",
            "priceCurrency": "USD",
            "billingIncrement": 1,
            "unitCode": "MON"
          }
        },
        {
          "@type": "Offer",
          "name": "Local Growth System",
          "price": "797",
          "priceCurrency": "USD",
          "description": "$797/month plus a one-time $997 launch. Everything in Local Visibility plus a conversion-focused website built in, technical SEO, a quote/estimate conversion path and automated follow-up. 90-day initial term, then month-to-month.",
          "availability": "https://schema.org/InStock",
          "priceSpecification": {
            "@type": "UnitPriceSpecification",
            "price": "797",
            "priceCurrency": "USD",
            "billingIncrement": 1,
            "unitCode": "MON"
          }
        }
      ]
    }
    </script>

    <!-- ───────── JSON-LD: FAQPage ───────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What kinds of businesses does Coach Ty Leads work with?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Local service businesses of all kinds — home services like pressure washing, plumbing, HVAC, roofing, and pool care, plus other local trades and service providers who get most of their customers from their local area. If your next customer is searching Google or asking ChatGPT for a business near them, Coach Ty Leads helps them find you."
          }
        },
        {
          "@type": "Question",
          "name": "How much does Coach Ty Leads cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Two plans. Local Visibility is $397/month plus a one-time $397 activation — Google Business Profile management, reviews, missed-call text-back and lead tracking for a business that already has a usable website. Local Growth System is $797/month plus a one-time $997 launch, and adds a conversion-focused website built in, technical SEO and automated follow-up. Both run a 90-day initial term, then month-to-month. Start with the free Growth Score to see which fits."
          }
        },
        {
          "@type": "Question",
          "name": "Does Coach Ty Leads help me show up in ChatGPT and AI search, not just Google?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Coach Ty Leads optimizes for both traditional Google local results and AI search — ChatGPT, Perplexity, Gemini, and Google AI Overviews — because that's increasingly where buyers ask for a recommendation."
          }
        },
        {
          "@type": "Question",
          "name": "Is there a guarantee?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Not a ranking or lead guarantee — anyone who promises those is guessing. What we do commit to, in writing: we agree the launch scope and the tracked search terms before work begins, and if the agreed foundation deliverables aren't finished within the documented launch window for reasons under our control, we keep working at no extra management charge until they are."
          }
        },
        {
          "@type": "Question",
          "name": "Can you actually guarantee leads?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No — and we won't pretend to. Whether a click becomes a job depends on your competition, your reviews, how fast you answer, and market conditions. We guarantee the implementation, not the outcome: the agreed launch scope gets completed, or we keep working at no extra management charge until it's done."
          }
        },
        {
          "@type": "Question",
          "name": "Why does it cost so much less than a $5,000/month agency?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Because you're not paying for an office, an account manager, or a sales team — Ty does the work himself. Plans are $397/month for visibility or $797/month for the complete system with a website built in. A $5,000/month agency retainer is $60,000 in year one, usually on a 12-month contract. Same work, without the overhead you were funding."
          }
        },
        {
          "@type": "Question",
          "name": "Who is behind Coach Ty Leads?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ty Alexander Traufield — “Coach Ty” — based in St. Petersburg and serving all of Tampa Bay. He's a group strength & conditioning coach and a full-time GM who trains for HYROX, and he built the Lola Local Growth System to fix the local visibility of his father's real business, Sandbar Soft Wash. He now runs that same system for other local service businesses, does the work himself, and answers his own phone."
          }
        },
        {
          "@type": "Question",
          "name": "Why is it called Lola?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Lola is Ty's dog — born in 2018, and the reason the whole thing exists. The goal behind the business is simple: help enough local businesses win to buy her the backyard she deserves. When you win, so does she."
          }
        }
      ]
    }
    </script>
  </head>
  <!-- Ground and ink come from index.css, not utilities here. These two classes
       are class selectors and so outrank the `body { background; color }` rule,
       which is why lifting the page off pure black silently did nothing. -->
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
